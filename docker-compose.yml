# Sentinel Attend (secure CCTV attendance) — zero-ingress deployment.
# Nothing listens on a public interface. Caddy (UI/API) and the WebRTC UDP port bind only to
# VMS_BIND_IP (default 127.0.0.1; set it to the server's LAN or Tailscale IP).
# Remote access: Tailscale (recommended, WebRTC works) or Cloudflare Tunnel + Access (HLS fallback).

name: secure-cctv-attendance

x-common: &common
  restart: unless-stopped
  env_file: .env
  security_opt: ["no-new-privileges:true"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vms
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vms"], interval: 10s, retries: 10 }

  api:
    <<: *common
    build: { context: ., dockerfile: api/Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      VMS_DATABASE_URL: postgresql+psycopg://vms:${POSTGRES_PASSWORD}@db:5432/vms
      VMS_STORE_DIR: /data/store
      VMS_SETUP_CODE_FILE: /data/store/setup-code.txt   # first run only; read with: docker compose exec api cat /data/store/setup-code.txt
      VMS_FACE_DET_MODEL: /models/face_detection_yunet_2023mar.onnx
      VMS_FACE_REC_MODEL: /models/face_recognition_sface_2021dec.onnx
    volumes: [snapshots:/data/snapshots, store:/data/store, ./models:/models:ro]
    depends_on: { db: { condition: service_healthy } }
    networks: [backend, egress]   # egress only for Twilio / WhatsApp / enrichment

  mediamtx:
    <<: *common
    image: bluenviron/mediamtx:1.9.3
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${VMS_WEBRTC_HOSTS:-}
    ports:
      - "${VMS_BIND_IP:-127.0.0.1}:8189:8189/udp"   # WebRTC media only (DTLS-SRTP)
    networks: [backend, cameras]

  worker:
    <<: *common
    build: { context: ., dockerfile: worker/Dockerfile }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    volumes: [./models:/models:ro]
    environment:
      VMS_API_URL: http://api:8000
      VMS_RTSP_BASE: rtsp://mediamtx:8554
      VMS_WORKER_SHARD: "0/1"      # scale out: run N workers with 0/N, 1/N ...
    depends_on: [api, mediamtx]
    networks: [backend, egress]
    deploy: { resources: { limits: { cpus: "${VMS_WORKER_CPUS:-8}" } } }

  privacy:   # the only service that sees unblurred video; publishes cam<N>_priv
    <<: *common
    build: { context: ., dockerfile: worker/Dockerfile }
    command: ["python", "privacy.py"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    volumes: [./models:/models:ro]
    environment:
      VMS_API_URL: http://api:8000
      VMS_RTSP_BASE: rtsp://mediamtx:8554
    depends_on: [api, mediamtx]
    networks: [backend]

  recorder:  # encrypted recording: blurred (media key) + raw (sealed to the vault)
    <<: *common
    build: { context: ., dockerfile: worker/Dockerfile }
    command: ["python", "recorder.py"]
    cap_drop: [ALL]
    volumes: [store:/data/store]
    environment:
      VMS_API_URL: http://api:8000
      VMS_RTSP_BASE: rtsp://mediamtx:8554
      VMS_STORE_DIR: /data/store
    depends_on: [api, mediamtx]
    networks: [backend]

  caddy:
    <<: *common
    image: caddy:2.8-alpine
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddydata:/data
    ports:
      - "${VMS_BIND_IP:-127.0.0.1}:8443:8443"
    depends_on: [api, mediamtx]
    networks: [backend, edge]     # internal networks cannot publish ports, hence 'edge'

  # Optional: outbound-only Cloudflare Tunnel. No inbound port is ever opened.
  # Put a Cloudflare Access policy (SSO + device posture) in front of the hostname.
  cloudflared:
    <<: *common
    profiles: [tunnel]
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}" }
    networks: [backend, egress]

networks:
  backend: { internal: true }   # no internet route
  egress: {}
  edge: {}                      # only Caddy; published on VMS_BIND_IP
  cameras: {}                   # attach to the camera VLAN (macvlan/ipvlan in production)

volumes: { pgdata: {}, snapshots: {}, store: {}, caddydata: {} }
